<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>isandburn.github.io</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .code-card {
      width: 100%;
      max-width: 640px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
    }

    .code-title {
      font-size: 13px;
      color: #8b949e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .copy-btn:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .copy-btn.copied {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #c9d1d9;
    }

    code {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="code-card">
    <div class="code-header">
      <span class="code-title" id="codeTitle">code</span>
      <button class="copy-btn" id="copyBtn" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25v-7.5Z"/>
          <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25v-7.5Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25h-7.5Z"/>
        </svg>
        <span id="copyLabel">Copy</span>
      </button>
    </div>
    <pre><code id="codeBlock">Loading code…</code></pre>
  </div>

  <script>
    const copyBtn = document.getElementById("copyBtn");
    const copyLabel = document.getElementById("copyLabel");
    const codeBlock = document.getElementById("codeBlock");
    const codeTitle = document.getElementById("codeTitle");

    // Escape HTML-sensitive characters so the raw code text is displayed
    // literally (e.g. "<" and ">" in generics / XML docs) instead of being
    // parsed as markup.
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Load the code from a plain text file so you can paste arbitrary code
    // without worrying about HTML escaping.
    fetch("code_block_content.txt")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then((text) => {
        // Optional first line acts as the title, e.g. "//RadixTrie.cs".
        // It is stripped from the displayed/copied code.
        const lines = text.split("\n");
        const first = lines[0]?.trim() ?? "";
        const titleMatch = first.match(/^\/\/\s*(.+)$/);
        if (titleMatch) {
          codeTitle.textContent = titleMatch[1].trim() || "code";
          lines.shift();
        }
        codeBlock.innerHTML = escapeHtml(lines.join("\n"));
      })
      .catch((err) => {
        codeBlock.textContent = "Failed to load code_block_content.txt: " + err.message;
      });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeBlock.textContent);
      } catch (err) {
        // Fallback for older browsers / non-secure contexts
        const range = document.createRange();
        range.selectNodeContents(codeBlock);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand("copy");
        selection.removeAllRanges();
      }

      copyBtn.classList.add("copied");
      copyLabel.textContent = "Copied!";

      setTimeout(() => {
        copyBtn.classList.remove("copied");
        copyLabel.textContent = "Copy";
      }, 2000);
    });
  </script>
</body>
</html>
